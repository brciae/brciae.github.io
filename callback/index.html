<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla OAuth Callback</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0c0e; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #181a1f; border: 1px solid #2e3138; border-radius: 20px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 20px; margin-bottom: 12px; color: #34c759; }
    p { font-size: 13px; color: #a0a5ad; line-height: 1.6; }
    .code-box { background: #0e1013; border: 1px solid #23252b; border-radius: 12px; padding: 14px; font-family: monospace; font-size: 13px; word-break: break-all; color: #3b93ff; margin: 16px 0; user-select: all; }
    button { background: #3b93ff; color: #ffffff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2880eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1>인증 완료 (Tesla Authorization)</h1>
    <p>테슬라 계정 승인 코드가 수신되었습니다. 아래 코드를 복사하거나 확인하세요.</p>
    <div id="codeDisplay" class="code-box">확인 중…</div>
    <button onclick="copyCode()">코드 복사하기</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code') || params.get('access_token') || '코드가 없습니다.';
    document.getElementById('codeDisplay').innerText = code;
    function copyCode() {
      navigator.clipboard.writeText(code).then(() => alert('코드가 클립보드에 복사되었습니다.'));
    }
  </script>
</body>
</html>
