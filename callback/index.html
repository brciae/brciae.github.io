<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesla OAuth Callback</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b0c0e; color: #ffffff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
    .card { background: #181a1f; border: 1px solid #2e3138; border-radius: 20px; padding: 32px; max-width: 520px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; }
    h1 { font-size: 20px; margin-bottom: 12px; color: #34c759; }
    p { font-size: 13px; color: #a0a5ad; line-height: 1.6; }
    .code-box { background: #0e1013; border: 1px solid #23252b; border-radius: 12px; padding: 14px; font-family: monospace; font-size: 13px; word-break: break-all; color: #3b93ff; margin: 16px 0; user-select: all; }
    button { background: #3b93ff; color: #ffffff; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #2880eb; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="heading">테슬라 로그인 확인</h1>
    <p>이번 로그인 완료 주소를 복사해 앱의 2단계에 붙여넣으세요. 이 주소는 한 번만 사용할 수 있으며 다른 사람에게 공유하면 안 됩니다.</p>
    <div id="codeDisplay" class="code-box">확인 중…</div>
    <button id="copy" onclick="copyCode()" disabled>앱으로 전달할 전체 URL 복사</button>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const valid = params.getAll('code').length === 1 && !!params.get('code') && params.getAll('state').length === 1 && !!params.get('state') && !params.has('error');
    const callbackURL = window.location.href;
    document.getElementById('heading').innerText = valid ? '로그인 승인 코드 수신됨' : '새 로그인이 필요합니다';
    document.getElementById('codeDisplay').innerText = valid ? callbackURL : '앱의 1단계에서 다시 로그인해 주세요.';
    document.getElementById('copy').disabled = !valid;
    async function copyCode() {
      if (!valid) return;
      try {
        await navigator.clipboard.writeText(callbackURL);
        alert('전체 URL 복사됨. 앱의 2단계에 붙여넣으세요.');
      } catch { alert('복사하지 못했습니다. 표시된 전체 주소를 직접 선택해 복사해 주세요.'); }
    }
  </script>
</body>
</html>
